name: ekatimer
description: "A beautiful modern meditation timer app for iOS and Android."
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.3.4
  audioplayers: ^6.1.0
  vibration: ^3.0.0
  wakelock_plus: ^1.2.10
  flutter_local_notifications: ^21.0.0
  intl: ^0.20.2
  uuid: ^4.5.1
  home_widget: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # to generate app icons
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/translations/

# dart run flutter_launcher_icons to generate Android app icons
# for iOS, use Icon Composer better

flutter_launcher_icons:
  android: true
  ios: false

  image_path: "images/whitemode.png"

  adaptive_icon_foreground: "images/whitemode.png"
  adaptive_icon_background: "#FFFFFF"